workflows:
  build-aab-workflow:
    name: Build AAB
    max_build_duration: 60
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.aabforge.app"
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android-template/local.properties"

      - name: Decode keystore
        script: |
          mkdir -p "$CM_BUILD_DIR/android-template/app"
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android-template/app/release.jks"
          export CM_KEYSTORE_PATH="$CM_BUILD_DIR/android-template/app/release.jks"
          echo "CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
          ls -la "$CM_BUILD_DIR/android-template/app/release.jks"

      - name: Ensure Gradle wrapper is executable
        working_directory: android-template
        script: |
          chmod +x ./gradlew
          ls -la ./gradlew

      - name: Build AAB
        working_directory: android-template
        script: |
          ./gradlew --no-daemon bundleRelease --stacktrace

    artifacts:
      - android-template/app/build/outputs/**/*.aab
      - android-template/app/build/outputs/**/mapping.txt
