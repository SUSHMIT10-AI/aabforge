plugins {
    id 'com.android.application'
}

def keystoreFile = System.getenv("CM_KEYSTORE_PATH") ?: "release.jks"
def ksFile = file(keystoreFile)
def hasReleaseKeystore = ksFile.exists()

android {
    namespace 'com.aabforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aabforge.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile ksFile
                storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("CM_KEY_ALIAS") ?: ""
                keyPassword System.getenv("CM_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Force a single Kotlin stdlib version across all transitive deps
// to avoid "Duplicate class kotlin.*.jdk8.*" errors from old kotlin-stdlib-jdk8.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation('androidx.webkit:webkit:1.11.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
