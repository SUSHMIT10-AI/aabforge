workflows:
  build-aab-workflow:
    name: Build AAB
    max_build_duration: 60
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.aabforge.app"
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android-template/local.properties"

      - name: Debug repo layout
        script: |
          echo "===== Root build dir ====="
          ls -la $CM_BUILD_DIR
          echo "===== android-template ====="
          ls -la $CM_BUILD_DIR/android-template
          echo "===== app folder ====="
          ls -la $CM_BUILD_DIR/android-template/app

      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android-template/app/release.jks
          echo "Keystore decoded successfully"
          ls -la $CM_BUILD_DIR/android-template/app/release.jks

      - name: Make gradlew executable
        script: |
          chmod +x $CM_BUILD_DIR/android-template/gradlew

      - name: Build AAB
        working_directory: android-template
        script: |
          ./gradlew bundleRelease --stacktrace

    artifacts:
      - android-template/app/build/outputs/**/*.aab
      - android-template/app/build/outputs/**/mapping.txt
      - android-template/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-aitechdeveloper45@gmail.com
        notify:
          success: true
          failure: true
